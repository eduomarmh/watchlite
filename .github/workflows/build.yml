name: Build & test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Lint (report only)
        run: ./gradlew --no-daemon lintDebug || true
      - uses: actions/upload-artifact@v4
        with:
          name: watchlite-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: watchlite-apk
          path: app/build/outputs/apk
      - uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: app/build/outputs/apk/androidTest/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android 8 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 1536
          script: ./scripts/ci-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: ci-out/
      - name: Publish results to ci-results branch
        if: always()
        run: |
          mkdir -p pub
          cp -r ci-out pub/ || true
          cp app/build/outputs/apk/debug/app-debug.apk pub/ || true
          cp app/build/outputs/apk/release/app-release.apk pub/ || true
          cd pub
          git init -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI results ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
      - name: Fail on crash
        run: test ! -f ci-out/CRASHED
